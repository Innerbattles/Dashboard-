<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard Navideño 🎄</title>

<style>
:root{
  --vh: 1vh;

  /* 🎄 Paleta navideña */
  --pine:#0f3d2e;        /* verde pino */
  --pine-dark:#082a20;
  --berry:#9c1c2c;       /* rojo navideño */
  --berry-dark:#6e0f1c;
  --gold:#f2c94c;
  --gold-soft:#ffe9a6;
  --cream:#fff8ec;
  --ink:#1b1410;
  --glass: rgba(255,248,236,.16);
  --glass-strong: rgba(255,248,236,.28);
}

html,body{
  margin:0;height:100%;width:100%;
  background:var(--pine-dark);
  color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

/* ===== BOARD ===== */
#board{
  position:relative; z-index:1; overflow:hidden;
  width:100vw; height:100vh;
  padding:calc(4.2*var(--vh)) calc(1.6*var(--vh)) calc(3.2*var(--vh));
  box-sizing:border-box;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(242,201,76,.20), transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(156,28,44,.55), transparent 60%),
    linear-gradient(135deg, var(--pine) 0%, #14513c 45%, var(--berry-dark) 100%);
  display:flex; flex-direction:column; gap:calc(0.8*var(--vh));
}

h2{
  margin:0; text-align:center; font-weight:900; letter-spacing:.5px;
  font-size:calc(4.0*var(--vh)); line-height:1.1;
  color:var(--gold-soft);
  text-shadow:0 2px 0 var(--berry-dark), 0 0 18px rgba(242,201,76,.55);
}

.chips{
  display:flex; gap:calc(.6*var(--vh)); flex-wrap:wrap;
  justify-content:center; margin-top:calc(-.3*var(--vh));
}
.chip{
  padding:calc(.35*var(--vh)) calc(.9*var(--vh));
  border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(6px);
  color:var(--cream);
  border:1px solid rgba(242,201,76,.65);
  font-weight:800; font-size:calc(1.5*var(--vh));
  box-shadow:0 0 12px rgba(242,201,76,.25), inset 0 1px 0 rgba(255,255,255,.25);
}
.chip.xmas{
  background:linear-gradient(135deg,var(--berry),#c0283a);
  border-color:var(--gold);
}

/* ===== TABLA ===== */
.table-wrap{ flex:1; min-height:0; position:relative; }
table{
  width:100%; height:100%;
  border-collapse:separate; border-spacing:0 10px;
  table-layout:fixed; font-size:calc(1.7*var(--vh));
}

thead th{
  position:sticky; top:0; z-index:2;
  background:linear-gradient(180deg,#c0283a,var(--berry));
  color:var(--cream);
  text-transform:uppercase; letter-spacing:.3px;
  font-size:calc(1.6*var(--vh)); font-weight:900;
  padding:calc(.6*var(--vh)) calc(0.9*var(--vh));
  border-radius:10px;
  border:1px solid var(--gold);
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}

th.col-rank, td.col-rank { width:9%; text-align:center; }
th.col-agent,td.col-agent{ width:30%; text-align:left; }
th.col-today,td.col-today{ width:12%; text-align:center; }
th.col-day,  td.col-day  { width:7%;  text-align:center; }
th.col-total,td.col-total{ width:12%; text-align:center; }

tbody td{
  background:rgba(255,248,236,.92);
  border-top:1px solid rgba(242,201,76,.55);
  border-bottom:1px solid rgba(242,201,76,.55);
  padding:calc(.7*var(--vh)) calc(0.9*var(--vh));
}
tbody tr:nth-child(even) td{ background:rgba(232,247,236,.92); }

tbody tr td:first-child{
  border-left:4px solid var(--berry);
  border-top-left-radius:14px; border-bottom-left-radius:14px;
}
tbody tr:nth-child(even) td:first-child{ border-left-color:#1f8a5b; }
tbody tr td:last-child{
  border-right:1px solid rgba(242,201,76,.55);
  border-top-right-radius:14px; border-bottom-right-radius:14px;
}
tbody tr{ transition:transform .25s ease, box-shadow .25s ease; }
tbody tr:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.35); }

.rankwrap{ display:inline-flex; align-items:center; justify-content:center; font-weight:900; }

.agent-wrap{ display:flex; align-items:center; gap:12px; min-width:0; }
.avatar{
  flex:0 0 auto; width:44px; height:44px; border-radius:50%;
  background:radial-gradient(circle at 30% 25%, #ff6b7a, var(--berry) 70%);
  border:2px solid var(--gold);
  display:grid; place-items:center;
  font-weight:900; font-size:14px; letter-spacing:.5px;
  color:#fff; text-transform:uppercase;
  box-shadow:0 4px 14px rgba(0,0,0,.25), inset 0 0 8px rgba(255,255,255,.3);
}
tbody tr:nth-child(even) .avatar{
  background:radial-gradient(circle at 30% 25%, #4fd69a, #17744c 70%);
}
.name{
  font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.bar{
  position:relative; height:22px; border-radius:999px;
  background:rgba(15,61,46,.12); border:1px solid rgba(0,0,0,.10); overflow:hidden;
}
.bar > .fill{
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:linear-gradient(90deg,#1f8a5b,#7be0a8);
  box-shadow:0 0 14px rgba(31,138,91,.55); transition:width .8s ease;
}
.bar.total > .fill{
  background:linear-gradient(90deg,#f0a93b,#ffe08a);
  box-shadow:0 0 14px rgba(242,201,76,.65);
}
.bar .value{ position:relative; z-index:1; font-weight:900; font-size:90%; color:var(--ink); }

.spark{
  position:relative; height:18px; border-radius:8px;
  background:rgba(156,28,44,.08); border:1px solid rgba(0,0,0,.08);
  overflow:hidden; display:grid; place-items:center;
  font-weight:800; font-size:85%;
}
.spark .f{
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:linear-gradient(90deg, rgba(192,40,58,.45), rgba(192,40,58,.08));
  transition:width .6s ease;
}

#meta{
  display:flex; justify-content:space-between; align-items:center;
  font-weight:800; font-size:calc(1.5*var(--vh)); color:var(--cream);
  position:relative; z-index:6;
}
#diag .ok{ color:#9af0c2; }
#diag .err{ color:#ffb3bb; }

.dots{ display:flex; gap:8px; align-items:center; }
.dot{
  width:9px; height:9px; border-radius:999px;
  background:var(--berry); opacity:.6; border:1px solid var(--gold);
}
.dot.on{ opacity:1; background:var(--gold); box-shadow:0 0 10px rgba(242,201,76,.9); }

/* ===== Medals ===== */
.medal{
  display:inline-grid; place-items:center;
  width:38px; height:38px; border-radius:50%;
  margin-right:8px; font-size:20px; line-height:1;
  border:1px solid rgba(0,0,0,.15);
  box-shadow:0 6px 16px rgba(0,0,0,.2), inset 0 0 16px rgba(255,255,255,.35);
}
.gold  { background:linear-gradient(180deg,#ffe9a6,#f2c94c); }
.silver{ background:linear-gradient(180deg,#f0f3f6,#cfd6e0); }
.bronze{ background:linear-gradient(180deg,#f3c9a1,#c88a4a); }

/* ===== 💡 LUCES NAVIDEÑAS (arriba) ===== */
.lights{
  position:fixed; top:0; left:0; right:0; height:calc(4.6*var(--vh));
  z-index:5; pointer-events:none;
  display:flex; justify-content:space-around; align-items:flex-start;
}
.lights::before{
  content:""; position:absolute; top:6px; left:0; right:0; height:3px;
  background:linear-gradient(90deg,#222,#444,#222);
  border-radius:3px; box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.bulb{
  position:relative; margin-top:8px;
  width:16px; height:24px; border-radius:50% 50% 50% 50% / 35% 35% 65% 65%;
  animation:twinkle 1.8s ease-in-out infinite;
}
.bulb::before{
  content:""; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
  width:8px; height:7px; background:#2b2b2b; border-radius:2px 2px 0 0;
}
.bulb.c0{ background:#ff3b4e; color:#ff3b4e; }
.bulb.c1{ background:#ffd23f; color:#ffd23f; }
.bulb.c2{ background:#2ee59d; color:#2ee59d; }
.bulb.c3{ background:#4cc3ff; color:#4cc3ff; }
.bulb{ box-shadow:0 0 14px 3px currentColor; }
@keyframes twinkle{
  0%,100%{ opacity:1; filter:brightness(1.15); }
  50%{ opacity:.35; filter:brightness(.7); }
}

/* ===== ❄ NIEVE EN EL SUELO ===== */
.ground{
  position:fixed; left:0; right:0; bottom:0; height:calc(2.4*var(--vh));
  z-index:3; pointer-events:none;
  background:
    radial-gradient(circle at 10px 0, #fff 10px, transparent 11px) 0 0/40px 100% repeat-x,
    linear-gradient(180deg, transparent 0, #f4f8ff 40%, #dfe9f7 100%);
  filter:drop-shadow(0 -2px 6px rgba(255,255,255,.35));
}

/* ===== OVERLAY — RankUp ===== */
#overlay.cod{
  position:fixed; inset:0; display:none; place-items:center; z-index:999;
  background:radial-gradient(900px 700px at 50% 40%,
    rgba(156,28,44,.35), rgba(8,42,32,.92) 60%, rgba(0,0,0,.96) 100%);
}
#overlay .burst{
  position:absolute; inset:0; pointer-events:none; opacity:.35;
  background:repeating-conic-gradient(from 0deg,
    rgba(242,201,76,.28) 0deg, transparent 6deg 12deg, rgba(255,80,100,.18) 18deg);
  mask:radial-gradient(ellipse at center, black 0%, transparent 60%);
  -webkit-mask:radial-gradient(ellipse at center, black 0%, transparent 60%);
  animation:spin 6s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes pop{ 0%{ transform:scale(.6); opacity:0; } 100%{ transform:scale(1); opacity:1; } }

#card{
  position:relative; padding:calc(4*var(--vh)) calc(6*var(--vh));
  border-radius:calc(2.2*var(--vh));
  background:linear-gradient(180deg,#0f3d2e,#082a20);
  border:3px solid var(--gold); color:#fff;
  text-align:center; animation:pop .45s ease-out;
  box-shadow:0 0 60px rgba(242,201,76,.35), 0 0 0 6px var(--berry), inset 0 0 28px rgba(242,201,76,.12);
  overflow:hidden;
}
.badge{ font-size:calc(5*var(--vh)); margin-bottom:calc(.5*var(--vh)); position:relative; z-index:2; }
#who{
  font:900 calc(7.6*var(--vh))/1.02 system-ui;
  letter-spacing:.6px; margin-bottom:calc(.3*var(--vh));
  position:relative; z-index:2; color:var(--gold-soft);
  text-shadow:0 0 18px rgba(242,201,76,.6);
}
#metaText{ font-size:calc(2.6*var(--vh)); font-weight:700; position:relative; z-index:2; }
#rankLine{ margin-top:calc(1.6*var(--vh)); display:flex; gap:14px; justify-content:center; position:relative; z-index:2; }
.delta, .position{
  font-weight:900; font-size:calc(3.4*var(--vh));
  padding:calc(.4*var(--vh)) calc(1.4*var(--vh)); border-radius:999px;
}
.delta.up{ background:#1f8a5b; }
.delta.down{ background:var(--berry); }
.position{ background:var(--gold); color:var(--ink); }

/* ===== SANTA ANIMADO ===== */
.santa-wrap{
  position:absolute; left:50%; top:calc(3.8*var(--vh));
  transform:translateX(-130%) translateY(20px);
  opacity:0; transition:.7s ease-out;
  pointer-events:none; z-index:1;
}
.santa-wrap.show{ transform:translateX(-130%) translateY(0); opacity:1; }
.santa{ width:80px; height:90px; position:relative; }
.santa-hat-main{
  border-left:28px solid transparent; border-right:28px solid transparent;
  border-bottom:40px solid #e63946; position:absolute; top:0; left:50%; transform:translateX(-50%);
}
.santa-hat-brim{
  width:60px; height:12px; background:#fff; border-radius:999px; position:absolute;
  top:35px; left:50%; transform:translateX(-50%); box-shadow:0 0 6px rgba(0,0,0,.25);
}
.santa-hat-ball{
  width:14px; height:14px; background:#fff; border-radius:50%; position:absolute;
  right:-4px; top:22px; box-shadow:0 0 4px rgba(0,0,0,.3);
}
.santa-face{
  width:52px; height:42px; background:#f7d1a3; border-radius:22px; position:absolute;
  top:26px; left:50%; transform:translateX(-50%); box-shadow:0 0 8px rgba(0,0,0,.35);
}
.santa-eyes{ position:absolute; top:13px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
.santa-eyes span{ width:6px; height:6px; background:#1b1b1b; border-radius:50%; }
.santa-nose{
  width:10px; height:8px; background:#f3b47b; border-radius:999px; position:absolute;
  top:22px; left:50%; transform:translateX(-50%);
}
.santa-beard{
  width:64px; height:40px; background:#fff; border-radius:50px 50px 46px 46px; position:absolute;
  bottom:-14px; left:50%; transform:translateX(-50%); box-shadow:0 0 10px rgba(0,0,0,.3);
}

/* ❄️ NIEVE (overlay) */
.flake{
  position:fixed; top:-20px; font-size:14px; color:#fff;
  pointer-events:none; opacity:.95; z-index:1000;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{ transform:translateY(0) translateX(0) rotate(0deg); }
  100%{ transform:translateY(110vh) translateX(25px) rotate(360deg); }
}

/* ===== GIFs ===== */

/* ===== ❄ NIEVE EN LOOP (generada por JS) ===== */
.snow-layer{
  position:fixed; inset:0; pointer-events:none; z-index:2; overflow:hidden;
}
.snowflake-css{
  position:absolute; top:-10vh; color:#fff; opacity:.85;
  animation:snowLoop linear infinite;
  text-shadow:0 0 6px rgba(255,255,255,.7);
}
@keyframes snowLoop{
  0%{ transform:translate3d(0,-10vh,0) rotate(0deg); }
  50%{ transform:translate3d(20px,50vh,0) rotate(180deg); }
  100%{ transform:translate3d(-10px,110vh,0) rotate(360deg); }
}

/* ===== 🌲 Pinos / regalos cayendo ===== */
.pineflake{
  position:fixed; top:-12vh; font-size:24px;
  pointer-events:none; opacity:.95; z-index:2;
  animation:pineFall linear infinite, pineWobble ease-in-out infinite;
}
@keyframes pineFall{
  0%{ top:-12vh; }
  100%{ top:112vh; }
}
@keyframes pineWobble{
  0%,100%{ margin-left:0; }
  25%{ margin-left:-12px; }
  50%{ margin-left:8px; }
  75%{ margin-left:-6px; }
}

/* ===== ⭐ ESTRELLAS ===== */
.star-layer{ position:fixed; inset:0; pointer-events:none; z-index:4; }
.star{
  position:absolute; color:#fff3a8; opacity:0;
  animation:starBlink 3.5s ease-in-out infinite;
  filter:drop-shadow(0 0 10px rgba(255,235,120,.95));
}
@keyframes starBlink{
  0%{ opacity:0; transform:scale(.9); }
  50%{ opacity:1; transform:scale(1.35); }
  100%{ opacity:0; transform:scale(.9); }
}
</style>
</head>

<body>

<!-- 🎅 GIFs navideños -->

<!-- 💡 Luces, nieve, pinos, estrellas, suelo (se generan por JS) -->
<div class="lights" id="lights" aria-hidden="true"></div>
<div id="pineLayer" aria-hidden="true"></div>
<div class="snow-layer" id="snowLayer" aria-hidden="true"></div>
<div class="star-layer" id="starLayer" aria-hidden="true"></div>
<div class="ground" aria-hidden="true"></div>

<div id='board'>
  <h2>🎄 MEXROS 🎅</h2>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>Week: —</div>
    <div id='chipDaily' class='chip'>Daily: —</div>
    <div id='chipXmas' class='chip xmas'>🎁 Navidad</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>#</th>
          <th class='col-agent'>Agent</th>
          <th class='col-today'>Today</th>
          <th class='col-day'>Wed</th>
          <th class='col-day'>Thu</th>
          <th class='col-day'>Fri</th>
          <th class='col-day'>Sat</th>
          <th class='col-day'>Mon</th>
          <th class='col-day'>Tue</th>
          <th class='col-total'>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id='meta'>
    <div id='diag'>Loading…</div>
    <div class='dots' id='dots'></div>
  </div>
</div>

<!-- ===== OVERLAY — RankUp Animation ===== -->
<div id='overlay' class='cod'>
  <div class='burst'></div>

  <div id='card'>
    <!-- 🎅 Santa animado -->
    <div class="santa-wrap" id="santaWrap">
      <div class="santa">
        <div class="santa-hat-main"></div>
        <div class="santa-hat-brim"></div>
        <div class="santa-hat-ball"></div>
        <div class="santa-face">
          <div class="santa-eyes"><span></span><span></span></div>
          <div class="santa-nose"></div>
          <div class="santa-beard"></div>
        </div>
      </div>
    </div>

    <div class='badge'>🎁</div>
    <div id='who'>Agent</div>
    <div id='metaText'>just passed — today! 🎉</div>

    <div id='rankLine'>
      <span class='delta' id='deltaBadge'>▲ +1</span>
      <span class='position' id='posBadge'>#1</span>
    </div>
  </div>
</div>

<script>

function setVHVar(){
  const vh=window.innerHeight*0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
}
setVHVar();
window.addEventListener('resize', setVHVar);

/* ===== 💡 Luces navideñas ===== */
(function buildLights(){
  const box=document.getElementById('lights');
  const count=Math.max(12, Math.floor(window.innerWidth/48));
  for(let i=0;i<count;i++){
    const b=document.createElement('span');
    b.className='bulb c'+(i%4);
    b.style.animationDelay=(-(i%4)*0.45)+'s';
    box.appendChild(b);
  }
})();

/* ===== ❄ Nieve en loop ===== */
(function buildSnow(){
  const layer=document.getElementById('snowLayer');
  const syms=["❄","❆","❅"];
  for(let i=0;i<36;i++){
    const f=document.createElement('div');
    f.className='snowflake-css';
    f.textContent=syms[i%3];
    f.style.left=(Math.random()*100)+'%';
    f.style.fontSize=(12+Math.random()*34)+'px';
    f.style.animationDuration=(9+Math.random()*9)+'s';
    f.style.animationDelay=(-Math.random()*16)+'s';
    f.style.opacity=(.5+Math.random()*.45);
    layer.appendChild(f);
  }
})();

/* ===== 🌲🎁 Pinos y regalitos cayendo ===== */
(function buildPines(){
  const layer=document.getElementById('pineLayer');
  const items=["🌲","🎄","🎁","🔔","🍬","🌲","🎄"];
  items.forEach((s,i)=>{
    const p=document.createElement('div');
    p.className='pineflake';
    p.textContent=s;
    p.style.left=(8+i*13)+'%';
    p.style.animationDuration=(15+Math.random()*6)+'s, '+(3+Math.random()*1.5)+'s';
    p.style.animationDelay=(-Math.random()*14)+'s, '+(-Math.random()*3)+'s';
    layer.appendChild(p);
  });
})();

/* ===== ⭐ Estrellas ===== */
(function buildStars(){
  const layer=document.getElementById('starLayer');
  const pos=[
    [8,12,30,0],[15,40,44,.8],[22,70,52,1.4],[35,25,28,2.2],
    [48,55,60,1.1],[62,15,18,2.8],[75,80,41,1.9],[85,35,50,.5]
  ];
  pos.forEach(([t,l,s,d],i)=>{
    const st=document.createElement('div');
    st.className='star';
    st.textContent=i%2?'✧':'✦';
    st.style.cssText=`top:${t}%;left:${l}%;font-size:${s}px;animation-delay:${d}s;`;
    layer.appendChild(st);
  });
})();

/* ===== 🎁 Cuenta regresiva a Navidad ===== */
function updateXmasChip(){
  const now=getLocalDate();
  let xmas=new Date(now.getFullYear(),11,25);
  const today0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((xmas-today0)/86400000);
  const el=document.getElementById('chipXmas');
  if(diff>0)      el.textContent=`🎁 Faltan ${diff} día${diff===1?'':'s'} para Navidad`;
  else if(diff===0) el.textContent='🎅 ¡Feliz Navidad! 🎄';
  else            el.textContent='🎆 ¡Felices fiestas!';
}

/* ===== ❄️ NIEVE + 🎄 ARBOLITOS (overlay) ===== */
const FLAKES = ["❄","❅","❆","🌲","🎄","🎁"];

function spawnFlakes() {
  for (let i = 0; i < 12; i++) {
    const flake = document.createElement("div");
    flake.className = "flake";
    flake.textContent = FLAKES[Math.floor(Math.random() * FLAKES.length)];

    const size = Math.random() * 14 + 10;
    const left = Math.random() * 100;

    flake.style.left = left + "vw";
    flake.style.fontSize = size + "px";
    flake.style.animationDuration = (6 + Math.random() * 6) + "s";

    document.body.appendChild(flake);
    flake.addEventListener("animationend", () => flake.remove());
  }
}

function stopFlakes(){
  document.querySelectorAll(".flake").forEach(f=>f.remove());
}

/* ===== Overlay Elements ===== */
const overlay=document.getElementById('overlay');
const whoEl=document.getElementById('who');
const metaTextEl=document.getElementById('metaText');
const deltaBadge=document.getElementById('deltaBadge');
const posBadge=document.getElementById('posBadge');
const santaWrap=document.getElementById('santaWrap');

/* ===== 🎅 Rank-Up Animation ===== */
function showRankUp({name,newRank,delta,passedName}){

  whoEl.textContent = name;
  metaTextEl.textContent = passedName
    ? `🎅 ¡Jo jo jo! just passed ${passedName} today!`
    : `🎅 ¡Jo jo jo! is climbing today!`;

  posBadge.textContent = `#${newRank+1}`;
  deltaBadge.textContent =
    (delta>0? "▲ +" : delta<0? "▼ -" : "— ") + Math.abs(delta||0);
  deltaBadge.className = "delta " + (delta>0? "up" : "down");

  overlay.style.display="grid";
  santaWrap.classList.add("show");

  spawnFlakes();
  const flakeTimer = setInterval(spawnFlakes, 900);

  setTimeout(()=>{
    clearInterval(flakeTimer);
    stopFlakes();
    santaWrap.classList.remove("show");
    overlay.style.display="none";
  },10000);
}

function getLocalDate(){
  const s=new Date().toLocaleString('en-US',{timeZone:TIMEZONE});
  return new Date(s);
}

function isoWeek(d){
  const x=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const n=x.getUTCDay()||7;
  x.setUTCDate(x.getUTCDate()+4-n);
  const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return {week:Math.ceil((((x-y)/86400000)+1)/7), year:x.getUTCFullYear()};
}
function weeksInISOYear(y){
  const d=new Date(Date.UTC(y,11,31));
  const day=d.getUTCDay();
  return (day===4 || (d.getUTCDate()===31 && day===3))?53:52;
}

function computeWeeklyTabName(){
  const url=new URL(window.location.href);
  const override=url.searchParams.get('weeklyTab');
  if(override) return override;

  const local=getLocalDate();
  const hrs=local.getHours();
  const dow=local.getDay();
  const iw=isoWeek(local);
  let w=iw.week;

  const afterCut=(dow>4) || (dow===4 && hrs>=14);
  if(afterCut){
    w++;
    const mx=weeksInISOYear(iw.year);
    if(w>mx){ w=1; }
  }
  return `W${w}`;
}

const emoji =
  /[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{1F900}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE0F}]/gu;

function normName(s){
  return (s||"")
    .replace(emoji,"")
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\x20-\x7E]/g,"")
    .replace(/\s{2,}/g," ")
    .trim()
    .toUpperCase();
}
function normID(s){ return (s||"").toString().trim(); }

/* ===== Safe Fetch with Retry ===== */
async function fetchSafeJSON(url, {tries=4, baseDelay=700} = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, {
        cache: 'no-store',
        headers: {
          'Cache-Control': 'no-cache, no-store, max-age=0',
          'Pragma': 'no-cache'
        }
      });

      if (r.ok) return await r.json();

      const text = await r.text();
      if (r.status === 429 || (r.status >= 500 && r.status < 600)) {
        const jitter = Math.random() * 250;
        await new Promise(res=>setTimeout(res, baseDelay*Math.pow(2,i)+jitter));
        continue;
      }
      throw new Error(`HTTP ${r.status} • ${text.slice(0,180)}`);

    } catch(e){
      lastErr = e;
      const jitter = Math.random() * 250;
      await new Promise(res=>setTimeout(res, baseDelay*Math.pow(2,i)+jitter));
    }
  }
  throw lastErr || new Error("fetchSafeJSON: unknown");
}

async function readWeeklyTab(weeklyTab){
  const ranges=[
    `${weeklyTab}!A3:C96`,
    `${weeklyTab}!D3:D96`,
    `${weeklyTab}!F3:F96`,
    `${weeklyTab}!H3:H96`,
    `${weeklyTab}!J3:J96`,
    `${weeklyTab}!L3:L96`,
    `${weeklyTab}!N3:N96`,
    `${weeklyTab}!O3:O96`
  ].map(encodeURIComponent);

  const url=
    `https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_SHEETID}/values:batchGet?`
    + ranges.map(r=>`ranges=${r}`).join("&")
    + `&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;

  const j=await fetchSafeJSON(url);
  const vr=j.valueRanges||[];

  const base=vr[0]?.values||[];
  const toCol=v=>(v?.values||[]).map(r=>(r[0]??"").toString().trim());

  const d=toCol(vr[1]), f=toCol(vr[2]), h=toCol(vr[3]),
        jv=toCol(vr[4]), l=toCol(vr[5]), n=toCol(vr[6]),
        oT=toCol(vr[7]);

  const len=Math.max(
    base.length, d.length, f.length, h.length,
    jv.length, l.length, n.length, oT.length
  );

  const out=[];
  for(let i=0;i<len;i++){
    const id = normID(base[i]?.[0] ?? "");
    const name = (base[i]?.[1] ?? "").toString().trim();
    if(!id && !name) continue;

    out.push({
      id,
      idKey:id,
      name,
      nameKey:normName(name),
      wed:parseInt(d[i]||0),
      thu:parseInt(f[i]||0),
      fri:parseInt(h[i]||0),
      sat:parseInt(jv[i]||0),
      mon:parseInt(l[i]||0),
      tue:parseInt(n[i]||0),
      total:parseInt(oT[i]||0),
      today:0
    });
  }

  out.sort((a,b)=>(b.total||0)-(a.total||0));
  return out;
}

function fmtDailyTab(dt){
  const m=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:TIMEZONE}).format(dt);
  const dd=new Intl.DateTimeFormat('en-US',{day:'2-digit',timeZone:TIMEZONE}).format(dt);
  return `${m} ${dd}`;
}

function getDailyTabCandidates(){
  const url=new URL(window.location.href);
  const o=url.searchParams.get('dailyTab');
  if(o) return [o];

  const now=getLocalDate();
  const y=new Date(now.getTime()-86400000);
  return [fmtDailyTab(now), fmtDailyTab(y)];
}

async function readDailyApproved(){
  const rangesFor=tab=>[
    `${tab}!A2:A40`,
    `${tab}!B2:B40`,
    `${tab}!C2:C40`,
    `${tab}!E2:E40`,
    `${tab}!F2:F40`,
    `${tab}!G2:G40`
  ].map(encodeURIComponent);

  const tabs=getDailyTabCandidates();
  const DAILY_IDS=[DAILY_ID_RAW];

  for(const id of DAILY_IDS){
    for(const tab of tabs){
      const url=
        `https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?`
        + rangesFor(tab).map(r=>`ranges=${r}`).join("&")
        + `&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;

      try{
        const j=await fetchSafeJSON(url);
        const vr=j.valueRanges||[];

        const A=vr[0]?.values||[], B=vr[1]?.values||[], C=vr[2]?.values||[];
        const E=vr[3]?.values||[], F=vr[4]?.values||[], G=vr[5]?.values||[];

        const mapByName=new Map();
        const mapByID=new Map();

        function addPair(nmCell,idCell,valCell){
          const nm=(nmCell?.[0]??"").toString();
          const id=(idCell?.[0]??"").toString().trim();
          const v=parseInt((valCell?.[0]??0))||0;

          if(nm.trim()){
            const nk=normName(nm);
            mapByName.set(nk,(mapByName.get(nk)||0)+v);
          }
          if(id){
            mapByID.set(id,(mapByID.get(id)||0)+v);
          }
        }

        const rowsFK=Math.max(A.length,B.length,C.length);
        for(let i=0;i<rowsFK;i++) addPair(A[i],B[i],C[i]);

        const rowsRG=Math.max(E.length,F.length,G.length);
        for(let i=0;i<rowsRG;i++) addPair(E[i],F[i],G[i]);

        return {id, tab, mapByName, mapByID};

      }catch(e){
        // intentar siguiente tab
      }
    }
  }

  return {
    id:DAILY_IDS[0],
    tab:tabs[0],
    mapByName:new Map(),
    mapByID:new Map()
  };
}

/* ===== Rank map & Detect Rank-Up ===== */
function buildTodayRanking(list){
  const copy=list.map(p=>({
    nameKey:p.nameKey,
    name:p.name,
    today:p.today||0
  }));
  copy.sort((a,b)=>(b.today||0)-(a.today||0));

  const rankMap=new Map();
  copy.forEach((p,i)=>rankMap.set(p.nameKey,i));
  return rankMap;
}

function detectAndCelebrate(list){
  const CUR_RANK=buildTodayRanking(list);
  let best=null;

  list.forEach(p=>{
    const key=p.nameKey;
    const prev=(PREV_T.get(key)||0);
    const cur=(p.today||0);
    const inc=cur - prev;

    if(inc>0){
      const pr=PREV_R.has(key)?PREV_R.get(key):Number.POSITIVE_INFINITY;
      const nr=CUR_RANK.get(key);

      let passed=null;
      if(nr<pr){
        for(let i=nr+1;i<=pr && i<list.length;i++){
          const behind=list.find(x=>CUR_RANK.get(x.nameKey)===i);
          if(behind){ passed=behind.name; break; }
        }
      }

      const delta=(pr===Number.POSITIVE_INFINITY)?0:(pr-nr);
      const ev={name:p.name,newRank:nr,delta,passedName:passed,inc};

      if(!best || ev.inc>best.inc || (ev.inc===best.inc && ev.newRank<best.newRank)){
        best=ev;
      }
    }
  });

  PREV_T.clear();
  PREV_R.clear();

  list.forEach(p=>{
    PREV_T.set(p.nameKey,p.today||0);
    PREV_R.set(p.nameKey, CUR_RANK.get(p.nameKey));
  });

  if(best) showRankUp(best);
}

/* ===== CACHES ===== */
async function getWeeklyCached(weeklyTab, ttl=WEEKLY_REFRESH){
  const Cache=window.__cacheW||(window.__cacheW={at:0,tab:null,data:null});
  if(Cache.data && Cache.tab===weeklyTab && (Date.now()-Cache.at)<ttl)
    return Cache.data;

  const data=await readWeeklyTab(weeklyTab);
  window.__cacheW={at:Date.now(),tab:weeklyTab,data};
  return data;
}

async function getDailyCached(ttl=DAILY_REFRESH-1000){
  const Cache=window.__cacheD||(window.__cacheD={at:0,tab:null,data:null});
  if(Cache.data && (Date.now()-Cache.at)<ttl) return Cache.data;

  const data=await readDailyApproved();
  window.__cacheD={at:Date.now(),tab:data.tab,data};
  return data;
}

/* ===== REFRESH FNS ===== */
async function refreshWeekly(){
  try{
    const weeklyTab=computeWeeklyTabName();
    setChipWeekly(weeklyTab);
    ALL_DATA=await getWeeklyCached(weeklyTab,WEEKLY_REFRESH);
    diag(`Weekly OK (${weeklyTab}) • ${ALL_DATA.length} agents`,'ok');
  }catch(e){
    diag('Weekly error: '+(e.message||e),'err');
  }
}

async function refreshDaily(){
  try{
    const {id,tab,mapByName,mapByID}=await getDailyCached(DAILY_REFRESH);
    setChipDaily(tab);

    if(!ALL_DATA.length){
      await refreshWeekly();
      if(!ALL_DATA.length) return;
    }

    ALL_DATA.forEach(p=>{
      const vID=mapByID.get(p.idKey);
      const vNM=mapByName.get(p.nameKey);
      p.today = (typeof vID==='number' && !Number.isNaN(vID))
        ? vID
        : (typeof vNM==='number' && !Number.isNaN(vNM))
          ? vNM
          : 0;
    });

    if(INITIALIZED){
      detectAndCelebrate(ALL_DATA);
    }else{
      const r=buildTodayRanking(ALL_DATA);
      ALL_DATA.forEach(p=>{
        PREV_T.set(p.nameKey,p.today||0);
        PREV_R.set(p.nameKey, r.get(p.nameKey));
      });
      INITIALIZED=true;
    }

    diag(`Daily OK (${tab})`,'ok');
  }catch(e){
    diag('Daily error: '+(e.message||e),'err');
  }
}

/* ===== ROTATE PAGES ===== */
function rotatePage(){
  if(!ALL_DATA.length) return;
  const totalPages=Math.max(1, Math.ceil(ALL_DATA.length/PAGE_SIZE));
  PAGE_INDEX=PAGE_INDEX%totalPages;
  renderPage(ALL_DATA,PAGE_INDEX);
  renderDots(totalPages, PAGE_INDEX);
  PAGE_INDEX=(PAGE_INDEX+1)%totalPages;
}

/* ===== START APP ===== */
(async function start(){
  updateXmasChip();
  setInterval(updateXmasChip, 60*60*1000);

  await refreshWeekly();
  await refreshDaily();
  rotatePage();

  setInterval(refreshWeekly, WEEKLY_REFRESH);
  setInterval(refreshDaily,  DAILY_REFRESH);
  setInterval(rotatePage,    PAGE_MS);
})();
